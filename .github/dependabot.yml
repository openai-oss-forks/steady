version: 2
updates:
  # The root manifest owns packages/* and their shared deno.lock.
  - package-ecosystem: deno
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # This only filters version updates; security updates remain eligible.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      # CodeQL steps exchange state and must use the same action release.
      codeql:
        patterns:
          - "github/codeql-action/*"
    # This only filters version updates; security updates remain eligible.
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
